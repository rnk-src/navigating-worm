# A short run of the terrain setup. It checks the pipeline, not the learning.

[run]
name = "terrain_v2_smoke"
steps = 20_000
n_envs = 2
seed = 0

[env]
obs_version = 2
world = "curriculum"
world_size = 8.0
cell = 0.1
randomizer_level = 1.0

[curriculum]
mode = "timesteps"
boundaries = [0.0, 0.25, 0.5, 0.75]
replay_lower = 0.3

[ppo]
n_steps = 256
batch_size = 256
n_epochs = 4
gamma = 0.99
learning_rate = 3e-4
net_arch = [64, 64]
log_std_init = -1.0

[checkpoint]
every_steps = 4096
keep = 2

[eval]
every_steps = 0
maps = 1
map_size = 4.0
